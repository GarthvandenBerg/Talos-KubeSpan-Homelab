apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/GarthvandenBerg/Talos-KubeSpan-Homelab.git"
    targetRevision: HEAD
    path: kubernetes/bootstrap # Points back to itself to manage the bootstrap
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-operators-gateway
  namespace: argocd-system
spec:
  project: default
  source:
    repoURL: "https://github.com/GarthvandenBerg/Talos-KubeSpan-Homelab.git"
    targetRevision: HEAD
    path: kubernetes/system 
    directory:
      recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
      name: public-vps-pool
      jsonPointers:
        - /spec/blocks
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: gateway-system
      jsonPointers:
        - /metadata/annotations/io.cilium~1lb-ip-am-static
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd-system
spec:
  project: default
  source:
    repoURL: "https://github.com/GarthvandenBerg/Talos-KubeSpan-Homelab.git"
    targetRevision: HEAD
    path: kubernetes/apps
    directory:
      recurse: true
      exclude: 'coroot-deployment/*'
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coroot-monitoring
  namespace: argocd-system
spec:
  project: default
  source:
    repoURL: "https://github.com/GarthvandenBerg/Talos-KubeSpan-Homelab.git"
    targetRevision: HEAD
    path: kubernetes/apps/coroot-deployment
    directory:
      recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
