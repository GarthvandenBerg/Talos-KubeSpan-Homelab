apiVersion: v1
kind: Namespace
metadata:
  name: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd-system
spec:
  project: default
  source:
    repoURL: ghcr.io/immich-app/immich-charts
    chart: immich
    targetRevision: 0.13.1
    helm:
      values: |
        controllers:
          main:
            containers:
              main:
                env:
                  DB_HOSTNAME: immich-db-rw.database-system.svc.cluster.local
                  DB_USERNAME: immich
                  DB_DATABASE_NAME: immich
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-db-app
                        key: password

        immich:
          persistence:
            library:
              existingClaim: immich-nfs-pvc

        valkey:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
