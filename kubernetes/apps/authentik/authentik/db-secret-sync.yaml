apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-read-db-secret
  namespace: database-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-db-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-sa-read-db-secret
  namespace: database-system
subjects:
  - kind: ServiceAccount
    name: secret-sync-sa
    namespace: authentik-system
roleRef:
  kind: Role
  name: allow-read-db-secret
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-sync-sa
  namespace: authentik-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-manage-authentik-secrets
  namespace: authentik-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-sa-manage-secrets
  namespace: authentik-system
roleRef:
  kind: Role
  name: allow-manage-authentik-secrets
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: secret-sync-sa
    namespace: authentik-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-authentik-db-secret
  namespace: authentik-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: secret-sync-sa
      containers:
        - name: sync
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eo pipefail
              echo "Extracting database secret..."
              
              DB_PASS=$(kubectl get secret authentik-db-app -n database-system -o jsonpath='{.data.password}' | base64 -d)
              DB_USER=$(kubectl get secret authentik-db-app -n database-system -o jsonpath='{.data.username}' | base64 -d)

              echo "Syncing secret to authentik-system..."
              kubectl create secret generic authentik-db-app \
                --namespace authentik-system \
                --from-literal=password="$DB_PASS" \
                --from-literal=username="$DB_USER" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "Sync complete."
      restartPolicy: OnFailure
