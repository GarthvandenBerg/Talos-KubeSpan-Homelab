apiVersion: v1
kind: Namespace
metadata:
  name: ggprohn-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ggprohn
  namespace: ggprohn-system
  labels:
    app.kubernetes.io/name: ggprohn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ggprohn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ggprohn
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: web
          image: ghcr.io/garthvandenberg/ggprohn:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ggprohn
  namespace: ggprohn-system
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ggprohn
