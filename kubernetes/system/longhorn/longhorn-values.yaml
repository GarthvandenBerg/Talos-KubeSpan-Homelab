global:
  tolerations:
    - key: "node.cilium.io/agent-not-ready"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

defaultSettings:
  createDefaultDiskLabeledNodes: true
  # Note: taintToleration is a semicolon-separated string in Longhorn settings
  taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule;node.cilium.io/agent-not-ready:NoSchedule"
  defaultDataPath: /var/lib/longhorn
  allowSchedulingOnControlPlaneNodes: false
  defaultReplicaCount: 2
  defaultMinSecondaryReplicaCount: 1
  defaultMinimumNumberOfBackingImageCopies: 2
  preflightCheck: false
  mkfsPropagateAllowed: true
  # Critical for older kernels/Talos compatibility
  mkfsExt4Parameters: "-O ^64bit,^metadata_csum"
  backupTarget: "s3://pvc-backup/longhorn/"
  backupTargetCredentialSecret: "longhorn-minio-creds"
  backupstorePollInterval: 300
  recurringJobSelector: '[{"name":"daily-backup", "isGroup":true}]'
  storageOverProvisioningPercentage: 500
  storageMinimalAvailablePercentage: 10
  dataLocality: "best-effort"
  autoCleanupSystemGeneratedSnapshot: true

persistence:
  defaultClassReplicaCount: 2

csi:
  # Required for Talos Linux
  kubeletRootDir: /var/lib/kubelet
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2 # This often adds the missing RBAC rules

service:
  ui: {}
