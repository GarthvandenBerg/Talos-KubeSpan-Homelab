apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: public-vps-pool
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: earth
  blocks:
    - cidr: "${public_ip}/32" # Injected from var.PUBLIC_NODE_IP
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: vps-announcement
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: earth
  ipPools:
    - public-vps-pool
  interfaces:
    - ".*"
  externalIPs: true
  loadBalancerIPs: true
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: local-pool
spec:
  blocks:
    - start: "192.168.2.201"
      stop: "192.168.2.240"
  disabled: false
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: local-announcement
spec:
  nodeSelector:
    matchExpressions:
      - key: l2-announce
        operator: In
        values:
          - "true"
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  ipPools:
    - local-pool
  interfaces:
    - ".*"
  externalIPs: true
  loadBalancerIPs: true
