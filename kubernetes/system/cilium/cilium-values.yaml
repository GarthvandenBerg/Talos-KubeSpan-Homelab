ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
bpf:
  masquerade: true
cni:
  install: true
  confPath: /etc/cni/net.d
  binPath: /opt/cni/bin
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, DAC_OVERRIDE, FOWNER, IPC_LOCK, KILL, NET_ADMIN, NET_RAW, SETGID, SETUID, SYS_ADMIN, SYS_RESOURCE]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
