apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/GarthvandenBerg/Talos-KubeSpan-Homelab.git"
    targetRevision: HEAD
    path: clusters/homelab-cluster/argocd/bootstrap
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
