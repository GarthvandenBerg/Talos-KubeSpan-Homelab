apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cfgate-gateway.yaml
  - ./namespace.yaml

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.1
    releaseName: cnpg-operator
    namespace: cnpg-system
    includeCRDs: true