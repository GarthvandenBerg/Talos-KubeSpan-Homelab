apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
annotations:
    argocd.argoproj.io/sync-wave: "-8"
resources:
  - ./namespace.yaml

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.2
    releaseName: cnpg-operator
    namespace: cnpg-system
    includeCRDs: true