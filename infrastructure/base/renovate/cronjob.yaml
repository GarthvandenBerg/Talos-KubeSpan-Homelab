apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
        spec:
          restartPolicy: Never
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44.180.0
              env:
                - name: RENOVATE_CONFIG_FILE
                  value: /opt/renovate/config.json
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: RENOVATE_TOKEN
              volumeMounts:
                - name: config
                  mountPath: /opt/renovate/config.json
                  subPath: config.json
          volumes:
            - name: config
              configMap:
                name: renovate-config
