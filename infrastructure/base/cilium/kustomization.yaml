apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./ip-pool-announcements.yaml
  - ./local-gateway.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.19.7
    releaseName: cilium
    namespace: kube-system
    valuesFile: cilium-values.yaml