apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./ip-pool-announcements.yaml
  - ./local-gateway.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.20.5
    releaseName: cilium
    namespace: kube-system
    valuesFile: cilium-values.yaml

patches:
  - target:
      labelSelector: app.kubernetes.io/instance=cilium
    patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-8"
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-9"