apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: local-pool
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  blocks:
    - start: "192.168.2.200"
      stop: "192.168.2.240"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: local-announcement
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  interfaces:
    - "^eth0$"
  externalIPs: true
  loadBalancerIPs: true
  serviceSelector: {}
