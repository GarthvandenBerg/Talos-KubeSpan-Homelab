apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: local-pool
spec:
  blocks:
    - start: "192.168.2.201"
      stop: "192.168.2.240"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: local-announcement
spec:
  nodeSelector:
    matchLabels:
      l2-announce: "true"
  interfaces:
    - ".*"
  externalIPs: true
  loadBalancerIPs: true
  serviceSelector: {}
