apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: talos-worker-1
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  allowScheduling: true
  disks:
    default-disk-1:
      allowScheduling: true
      path: "/var/lib/longhorn"
