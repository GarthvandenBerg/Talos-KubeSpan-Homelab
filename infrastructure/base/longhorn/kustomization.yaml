apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
annotations:
    argocd.argoproj.io/sync-wave: "-8"

resources:
  - longhorn-rbac.yaml
  - worker-label.yaml
  - worker-schedule.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    namespace: longhorn-system
    valuesFile: longhorn-values.yaml