apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./cloudflare-credentials-externalsecret.yaml
  - ./cfgate-gateway.yaml

helmCharts:
  - name: cfgate
    repo: oci://ghcr.io/cfgate/charts
    version: 1.10.0
    releaseName: cfgate
    namespace: cfgate-system
    includeCRDs: true
    valuesFile: cfgate-values.yaml
