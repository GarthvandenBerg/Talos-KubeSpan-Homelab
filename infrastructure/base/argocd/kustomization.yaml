apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./argocd-externalsecrets.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.18.2
    releaseName: argocd
    namespace: argocd-system
    includeCRDs: true
    valuesFile: argocd-values.yaml