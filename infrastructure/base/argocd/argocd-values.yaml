global:
  domain: argocd.cluster.local

server:
  extraArgs:
    - --insecure 
  service:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips-pool: "local-pool"
      lbipam.cilium.io/ips: "192.168.2.206"

controller:
  statusProcessors: 20
  operationProcessors: 10

redis:
  exporter:
    enabled: true

repoServer:
  metrics:
    enabled: true
