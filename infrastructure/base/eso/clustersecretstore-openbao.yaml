# ONE-TIME bootstrap (the only secret that never lives in Git):
#   kubectl -n external-secrets create secret generic openbao-approle \
#     --from-literal=secret-id='<secret-id from OpenBao>'
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "https://bao.g-space.co.za/"   
      path: "secret"        
      version: "v2"
      auth:
        appRole:
          path: approle
          roleId: "67fc1871-62db-2257-6416-852bbf189d1d"
          secretRef:
            name: openbao-approle
            namespace: external-secrets
            key: secret-id
