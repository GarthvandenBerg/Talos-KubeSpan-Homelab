apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-secret-sync-sa
  namespace: grafana-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-read-grafana-db-secret
  namespace: database-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-db-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-sa-read-grafana-db-secret
  namespace: database-system
subjects:
  - kind: ServiceAccount
    name: grafana-secret-sync-sa
    namespace: grafana-system
roleRef:
  kind: Role
  name: allow-read-grafana-db-secret
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-manage-grafana-secrets
  namespace: grafana-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-sa-manage-grafana-secrets
  namespace: grafana-system
roleRef:
  kind: Role
  name: allow-manage-grafana-secrets
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: grafana-secret-sync-sa
    namespace: grafana-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-grafana-db-secret
  namespace: grafana-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: grafana-secret-sync-sa
      containers:
        - name: sync
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eo pipefail
              echo "Starting Grafana DB secret sync..."

              kubectl get secret grafana-db-app -n database-system -o yaml | \
              grep -vE '^  (uid|resourceVersion|creationTimestamp):' | \
              awk '/ownerReferences:/{flag=1;next} /^[^ ]/{flag=0} !flag' | \
              kubectl label --local -f - argocd.argoproj.io/instance- --dry-run=client -o yaml | \
              sed 's/namespace: database-system/namespace: grafana-system/' | \
              kubectl annotate --local -f - argocd.argoproj.io/compare-options=IgnoreExtraneous argocd.argoproj.io/sync-options=Prune=false --dry-run=client -o yaml | \
              kubectl apply -f -

              echo "Grafana DB secret sync complete."
      restartPolicy: OnFailure
