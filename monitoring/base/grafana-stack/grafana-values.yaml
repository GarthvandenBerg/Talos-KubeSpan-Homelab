defaultRules:
  create: true
  rules:
    kubeProxy: false
    kubeScheduler: false
    kubeControllerManager: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

prometheus:
  enabled: true
  service:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips-pool: "local-pool"
      lbipam.cilium.io/ips: "192.168.2.231"
  prometheusSpec:
    retention: 60d
    retentionSize: 45GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  enabled: true

  service:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips-pool: "local-pool"
      lbipam.cilium.io/ips: "192.168.2.230"

  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-db-app
        key: password
    GF_DATABASE_USER:
      secretKeyRef:
        name: grafana-db-app
        key: username

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
      serve_from_sub_path: false
    database:
      type: postgres
      host: grafana-db-rw.database-system.svc.cluster.local:5432
      name: grafana
      user: grafana
      ssl_mode: disable

  persistence:
    enabled: false
