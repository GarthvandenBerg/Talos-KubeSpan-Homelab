# This is what lives in GitHub: a POINTER to the secret, never the value.
# ESO reads OpenBao and creates a normal K8s Secret named "grafana-admin".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: grafana-system
  annotations:
    argocd.argoproj.io/sync-wave: "-6" 
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: staging/grafana        
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: staging/grafana
        property: admin-password
