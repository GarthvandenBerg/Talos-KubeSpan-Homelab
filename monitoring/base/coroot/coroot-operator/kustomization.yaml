apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml

helmCharts:
  - name: coroot-operator
    repo: https://coroot.github.io/helm-charts
    version: 1.10.8
    releaseName: coroot-operator
    namespace: coroot-system
    includeCRDs: true

patches:
  - target:
      labelSelector: app.kubernetes.io/instance=coroot-operator
    patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-8"