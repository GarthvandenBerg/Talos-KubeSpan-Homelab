apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coroot-secret-reader
  namespace: database-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["coroot-db-creds"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coroot-secret-reader-binding
  namespace: database-system
subjects:
- kind: ServiceAccount
  name: coroot
  namespace: coroot-system
roleRef:
  kind: Role
  name: coroot-secret-reader
  apiGroup: rbac.authorization.k8s.io