apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: backup
  retain: 14
  concurrency: 1
  groups:
    - app-data
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: coroot-daily-backup
  namespace: database-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: coroot-db
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-daily-backup
  namespace: database-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "2 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: authentik-db
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-daily-backup
  namespace: database-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "1 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: immich-db
