apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-secret-sync-sa
  namespace: immich
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: immich-secret-sync-role
rules:
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: immich-secret-sync-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: immich-secret-sync-role
subjects:
  - kind: ServiceAccount
    name: immich-secret-sync-sa
    namespace: immich
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-read-immich-secrets
  namespace: database-system # Source namespace
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich-sync-sa-read-binding
  namespace: database-system # Source namespace
subjects:
  - kind: ServiceAccount
    name: immich-secret-sync-sa
    namespace: immich # Target namespace
roleRef:
  kind: Role
  name: allow-read-immich-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-immich-db-secret
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "2" # Runs after DB sync wave 1, before Immich deployment
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: immich-secret-sync-sa
      containers:
        - name: sync
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eo pipefail
              echo "Starting Immich DB secret sync..."

              kubectl get secret immich-db-app -n database-system -o yaml | \
              grep -vE '^  (uid|resourceVersion|creationTimestamp):' | \
              awk '/ownerReferences:/{flag=1;next} /^[^ ]/{flag=0} !flag' | \
              kubectl label --local -f - argocd.argoproj.io/instance- --dry-run=client -o yaml | \
              sed 's/namespace: database-system/namespace: immich/' | \
              kubectl annotate --local -f - argocd.argoproj.io/compare-options=IgnoreExtraneous argocd.argoproj.io/sync-options=Prune=false --dry-run=client -o yaml | \
              kubectl apply -f -

              echo "Sync complete."
      restartPolicy: OnFailure
