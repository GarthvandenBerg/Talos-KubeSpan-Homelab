apiVersion: v1
kind: Namespace
metadata:
  name: minecraft-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft-system
  labels:
    app.kubernetes.io/name: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
    spec:
      containers:
        - name: web
          image: itzg/minecraft-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 25565
              name: mc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
          - name: minecraft-data
            mountPath: /usr/local/tomcat/work
          - name: minecraft-mods
            mountPath: /mnt/hmdm-config
    volumes:
    - name: minecraft-data
      persistentVolumeClaim:
        claimName: minecraft-data-pvc
    - name: minecraft-mods
      persistentVolumeClaim:
        claimName: minecraft-mods-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft-system
  labels:
    l2-announce: "true"
  annotations:
    io.cilium/lb-ipam-ips: "192.168.2.230"
spec:
  type: LoadBalancer
  ports:
    - port: 25565
      targetPort: 25565
      protocol: TCP
      name: mc
  selector:
    app.kubernetes.io/name: minecraft
  
